name: AI4S 小分子日报

on:
  schedule:
    - cron: "13 1 * * *"   # 主时段: 01:13 UTC = 北京时间 09:13
    - cron: "37 4 * * *"   # 备用时段: 04:37 UTC = 北京时间 12:37，早间被 GitHub 延迟/丢弃时补发
  workflow_dispatch: {}    # 允许手动触发测试

permissions:
  contents: write          # 用于把已发记录 state.json 提交回仓库

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 准备配置
        run: cp config.example.json config.json

      - name: 抓取并发送日报
        env:
          AI4S_SMTP_KEY: ${{ secrets.AI4S_SMTP_KEY }}
          AI4S_LLM_API_KEY: ${{ secrets.AI4S_LLM_API_KEY }}
          AI4S_LLM_MODEL: ${{ vars.AI4S_LLM_MODEL }}
        run: python arxiv_ai4s_digest.py

      - name: 回写已发记录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update sent state"
            git push
          fi
